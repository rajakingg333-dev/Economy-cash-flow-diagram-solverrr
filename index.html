<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Economy All in one Solver - UET Taxila Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Safe Icon Component ---
        const Icon = ({ name, className }) => {
            if (name === "trending-up") {
                return (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                );
            }
            if (name === "plus-circle") {
                return (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                );
            }
            if (name === "percent") {
                return (
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="19" y1="5" x2="5" y2="19"></line>
                        <circle cx="6.5" cy="6.5" r="2.5"></circle>
                        <circle cx="17.5" cy="17.5" r="2.5"></circle>
                    </svg>
                );
            }
            return null;
        };

        // --- Math Helpers ---
        const calculateIRR = (flows) => {
            if (flows.length === 0) return null;
            const netFlows = flows.reduce((acc, f) => {
                acc[f.t] = (acc[f.t] || 0) + f.val;
                return acc;
            }, {});
            const entries = Object.entries(netFlows).map(([t, val]) => ({ t: parseInt(t), val }));
            
            let r = 0.1; 
            for (let i = 0; i < 100; i++) {
                let npv = 0;
                let dNpv = 0;
                for (const { t, val } of entries) {
                    npv += val / Math.pow(1 + r, t);
                    dNpv -= (t * val) / Math.pow(1 + r, t + 1);
                }
                if (Math.abs(dNpv) < 0.000001) break;
                let nextR = r - npv / dNpv;
                if (Math.abs(nextR - r) < 0.0001) return nextR * 100;
                r = nextR;
            }
            return null;
        };

        const Input = ({ label, value, onChange, placeholder = "0.00" }) => (
            <div className="flex flex-col w-full">
                <label className="text-[10px] font-bold text-slate-500 uppercase mb-1">{label}</label>
                <input type="number" step="any" className="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm w-full" 
                       value={value} onChange={onChange} placeholder={placeholder} />
            </div>
        );

        const ResultBox = ({ label, val, color, isPercent }) => {
            const themes = {
                blue: "bg-blue-50 border-blue-100 text-blue-700",
                emerald: "bg-emerald-50 border-emerald-100 text-emerald-700",
                amber: "bg-amber-50 border-amber-100 text-amber-700",
                rose: "bg-rose-50 border-rose-100 text-rose-700",
                indigo: "bg-indigo-50 border-indigo-100 text-indigo-700"
            };
            
            const displayVal = isPercent 
                ? (val !== null ? val.toFixed(4) + '%' : 'N/A')
                : (val < 0 ? '-$' : '$') + Math.abs(val).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            return (
                <div className={`p-4 border rounded-xl ${themes[color]}`}>
                    <p className="text-[10px] font-bold uppercase opacity-70">{label}</p>
                    <p className="text-xl font-bold truncate">{displayVal}</p>
                </div>
            );
        };

        const CashFlowDiagram = ({ flows, startYear, endYear }) => {
            const width = 800, height = 220, padding = 60, baseY = 110;
            const span = Math.max(endYear - startYear, 1);
            
            if (!flows || flows.length === 0) return <div className="h-32 flex items-center justify-center text-slate-300 italic text-sm">Add flows to generate diagram...</div>;
            
            const maxVal = Math.max(...flows.map(f => Math.abs(f.val))) || 1;
            const getX = (t) => padding + ((t - startYear) / span) * (width - padding * 2);

            return (
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto drop-shadow-sm">
                    <line x1={padding} y1={baseY} x2={width-padding} y2={baseY} stroke="#cbd5e1" strokeWidth="2" />
                    {flows.map((f, i) => {
                        if (f.t < startYear || f.t > endYear) return null;
                        const x = getX(f.t);
                        const h = (Math.abs(f.val) / maxVal) * 80 + 5;
                        const color = f.val >= 0 ? '#10b981' : '#ef4444';
                        return (
                            <g key={i}>
                                <line x1={x} y1={baseY} x2={x} y2={f.val >= 0 ? baseY-h : baseY+h} stroke={color} strokeWidth="3" />
                                <text x={x} y={f.val >= 0 ? baseY-h-10 : baseY+h+20} textAnchor="middle" fontSize="11" fill={color} fontWeight="bold">{Math.abs(f.val).toFixed(0)}</text>
                                <text x={x} y={baseY+40} textAnchor="middle" fontSize="10" fill="#94a3b8">Yr {f.t}</text>
                                <circle cx={x} cy={baseY} r="3" fill="#cbd5e1" />
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // --- Interest Rate Converter Section ---
        const InterestRateConverter = ({ onApplyRate }) => {
            const [calcMode, setCalcMode] = useState('eff'); 
            const [nominalRate, setNominalRate] = useState('10');
            const [effectiveRate, setEffectiveRate] = useState('');
            const [basePeriod, setBasePeriod] = useState('1'); // 1 = per Year, 12 = per Month, 52 = per Week
            const [m, setM] = useState('12'); 

            const compPeriods = [
                { label: 'Annually (m=1)', value: '1' },
                { label: 'Semiannually (m=2)', value: '2' },
                { label: 'Quarterly (m=4)', value: '4' },
                { label: 'Monthly (m=12)', value: '12' },
                { label: 'Weekly (m=52)', value: '52' },
                { label: 'Daily (m=365)', value: '365' },
                { label: 'Continuously (m=∞)', value: 'inf' }
            ];

            let calculatedEffective = null;
            let calculatedNominal = null;

            // Normalize values based on dynamic base periods (Yearly/Monthly/Weekly)
            if (calcMode === 'eff') {
                const r = ((parseFloat(nominalRate) || 0) / 100) / parseFloat(basePeriod);
                if (m === 'inf') {
                    calculatedEffective = (Math.exp(r) - 1) * 100;
                } else {
                    const mVal = parseInt(m) || 1;
                    calculatedEffective = (Math.pow(1 + r / mVal, mVal) - 1) * 100;
                }
            } else {
                const ia = (parseFloat(effectiveRate) || 0) / 100;
                if (ia >= -1) {
                    if (m === 'inf') {
                        calculatedNominal = Math.log(ia + 1) * 100 * parseFloat(basePeriod);
                    } else {
                        const mVal = parseInt(m) || 1;
                        calculatedNominal = mVal * (Math.pow(ia + 1, 1 / mVal) - 1) * 100 * parseFloat(basePeriod);
                    }
                }
            }

            const finalRateToApply = calcMode === 'eff' ? calculatedEffective : parseFloat(effectiveRate);

            return (
                <div className="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                    <div className="border-b pb-3">
                        <h2 className="text-md font-bold text-slate-700 flex items-center gap-2">
                            <Icon name="percent" className="w-5 h-5 text-blue-600" />
                            Nominal vs. Effective Interest Rates
                        </h2>
                        <p className="text-xs text-slate-500 mt-1">
                            <strong>Nominal Rate (r):</strong> Stated base rate. <br/>
                            <strong>Effective Rate (i<sub>eff</sub>):</strong> Actual interest calculated over the selected compounding interval setup.
                        </p>
                    </div>

                    <div className="flex flex-wrap gap-3 items-center justify-between">
                        <div className="flex gap-2 p-1 bg-slate-100 rounded-lg w-fit text-xs font-bold">
                            <button onClick={() => setCalcMode('eff')} className={`px-3 py-1.5 rounded-md transition ${calcMode === 'eff' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>
                                Find Effective Rate
                            </button>
                            <button onClick={() => setCalcMode('nom')} className={`px-3 py-1.5 rounded-md transition ${calcMode === 'nom' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>
                                Find Nominal Rate
                            </button>
                        </div>

                        <div className="flex items-center gap-2 text-xs">
                            <span className="font-bold text-slate-500 uppercase text-[10px]">Rate Stated Per:</span>
                            <select value={basePeriod} onChange={(e) => setBasePeriod(e.target.value)} className="px-2 py-1 border rounded bg-white font-medium text-slate-700">
                                <option value="1">Year</option>
                                <option value="12">Month</option>
                                <option value="52">Week</option>
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        {calcMode === 'eff' ? (
                            <Input label="Stated Nominal Rate r (%)" value={nominalRate} onChange={(e) => setNominalRate(e.target.value)} />
                        ) : (
                            <Input label="Target Effective Rate ieff (%)" value={effectiveRate} onChange={(e) => setEffectiveRate(e.target.value)} />
                        )}

                        <div className="flex flex-col w-full">
                            <label className="text-[10px] font-bold text-slate-500 uppercase mb-1">Compounding Period</label>
                            <select value={m} onChange={(e) => setM(e.target.value)} className="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white h-[38px]">
                                {compPeriods.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
                            </select>
                        </div>

                        <div className="p-3 bg-slate-50 border rounded-lg flex flex-col justify-center h-[38px]">
                            <span className="text-[9px] font-bold uppercase text-slate-400">Calculated Result</span>
                            <span className="text-sm font-black text-slate-700">
                                {calcMode === 'eff' 
                                    ? `ieff = ${calculatedEffective !== null ? calculatedEffective.toFixed(4) + '%' : '0.00%'}`
                                    : `r = ${calculatedNominal !== null ? calculatedNominal.toFixed(4) + '%' : '0.00%'}`
                                }
                            </span>
                        </div>
                    </div>

                    {finalRateToApply > 0 && (
                        <button type="button" onClick={() => onApplyRate(finalRateToApply.toFixed(4))}
                                className="text-xs bg-blue-50 text-blue-600 font-bold px-3 py-2 rounded-lg border border-blue-200 hover:bg-blue-100 transition w-full md:w-auto">
                            Apply Effective Rate to Project Analysis ↓
                        </button>
                    )}
                </div>
            );
        };

        function CustomBuilder() {
            const [i, setI] = useState('10');
            const [startYear, setStartYear] = useState('2026');
            const [endYear, setEndYear] = useState('2036');
            const [flows, setFlows] = useState([]);
            const [entry, setEntry] = useState({ type: 'single', amt: '', tS: '2026', tE: '2036', g: '0' });

            const addFlow = () => {
                if(!entry.amt || isNaN(entry.amt)) return;

                const amt = parseFloat(entry.amt) || 0;
                const tS = parseInt(entry.tS) || 0;
                const tE = parseInt(entry.tE) || 0;
                const g = parseFloat(entry.g) || 0;
                
                let newEntries = [];

                if (entry.type === 'single') {
                    newEntries.push({ t: tS, val: amt });
                } else if (entry.type === 'uniform') {
                    for (let k = tS; k <= tE; k++) newEntries.push({ t: k, val: amt });
                } else if (entry.type === 'gradient') {
                    for (let k = tS; k <= tE; k++) newEntries.push({ t: k, val: amt + (k - tS) * g });
                }

                setFlows([...flows, ...newEntries]);
                setEntry({ ...entry, amt: '' });
            };

            const rate = (parseFloat(i) || 0) / 100;
            const sYr = parseInt(startYear) || 0;
            const eYr = parseInt(endYear) || 0;
            const periods = Math.max(eYr - sYr, 0);
            
            let p = 0;
            flows.forEach(f => { 
                if(f.t >= sYr && f.t <= eYr) {
                    const relativeTime = f.t - sYr;
                    p += f.val / Math.pow(1 + rate, relativeTime); 
                }
            });
            
            const f = p * Math.pow(1 + rate, periods);
            const a = rate === 0 ? p / (periods || 1) : p * (rate * Math.pow(1 + rate, periods)) / (Math.pow(1 + rate, periods) - 1);
            
            // Adjust loop for IRR mapping relative to baseline year
            const irrValue = calculateIRR(flows.map(fl => ({ t: fl.t - sYr, val: fl.val })));

            return (
                <div className="space-y-6">
                    <InterestRateConverter onApplyRate={(rate) => setI(rate)} />

                    {/* Timeline Controls */}
                    <div className="grid grid-cols-3 gap-4 bg-white p-4 rounded-xl border shadow-sm">
                        <Input label="Global Analysis Rate i (%)" value={i} onChange={e=>setI(e.target.value)} />
                        <Input label="Start Analysis Year" value={startYear} onChange={e=>setStartYear(e.target.value)} />
                        <Input label="End Analysis Year" value={endYear} onChange={e=>setEndYear(e.target.value)} />
                    </div>

                    {/* Cash Flow Input Builder */}
                    <div className="bg-slate-100 p-5 rounded-2xl border-2 border-dashed border-slate-200 space-y-4">
                        <div className="flex gap-4">
                            {['single', 'uniform', 'gradient'].map(type => (
                                <button key={type} onClick={()=>setEntry({...entry, type})} 
                                        className={`text-xs font-bold px-3 py-1 rounded-full transition ${entry.type === type ? 'bg-blue-600 text-white':'bg-white text-slate-500'}`}>
                                    {type.toUpperCase()}
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <Input label="Amount $" value={entry.amt} onChange={e=>setEntry({...entry, amt:e.target.value})} />
                            <Input label="Start Year (t)" value={entry.tS} onChange={e=>setEntry({...entry, tS:e.target.value})} />
                            {entry.type !== 'single' && <Input label="End Year (t)" value={entry.tE} onChange={e=>setEntry({...entry, tE:e.target.value})} />}
                            {entry.type === 'gradient' && <Input label="Gradient G" value={entry.g} onChange={e=>setEntry({...entry, g:e.target.value})} />}
                        </div>
                        <button onClick={addFlow} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg flex items-center justify-center gap-2">
                            <Icon name="plus-circle" className="w-4 h-4"/> Add Series
                        </button>
                    </div>

                    {/* Financial Metric Output Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <ResultBox label={`Present Worth P (${sYr})`} val={p} color="emerald" />
                        <ResultBox label="Annual Worth (A)" val={a} color="rose" />
                        <ResultBox label={`Future Worth F (${eYr})`} val={f} color="blue" />
                        <ResultBox label="Internal Rate (IRR)" val={irrValue} color="indigo" isPercent={true} />
                    </div>

                    {/* Cash Flow Graph Visualization */}
                    <div className="bg-white p-6 rounded-2xl border shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-widest">Net Cash Flow Diagram ({sYr} - {eYr})</h3>
                            <button onClick={()=>setFlows([])} className="text-[10px] text-red-500 font-bold hover:underline">CLEAR ALL</button>
                        </div>
                        <CashFlowDiagram flows={flows} startYear={sYr} endYear={eYr} />
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-4xl mx-auto space-y-8">
                        <header className="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <div>
                                <h1 className="text-3xl font-black text-slate-800 tracking-tight">EcoSolve <span className="text-blue-600">Pro</span></h1>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-tighter">UET Taxila • 6th Semester Engineering Economics</p>
                                <p className="text-blue-500 text-[10px] font-bold uppercase mt-1">Designed by Muhammad Haseeb Raja</p>
                            </div>
                            <div className="p-4 bg-blue-600 text-white rounded-2xl rotate-3 shadow-lg shadow-blue-200">
                                <Icon name="trending-up" className="w-8 h-8" />
                            </div>
                        </header>
                        
                        <main className="bg-white p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100">
                            <CustomBuilder />
                        </main>
                        
                        <footer className="text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest">
                            Mechanical Engineering • Session 2023 • Muhammad Haseeb Raja 
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
